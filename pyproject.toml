[project]
name = "rag-project"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "pymilvus[bulk_writer]>=2.6.4,<2.7",
  "openai>=2,<3",
  "pyproj>=3.7,<4",
  "pyshp>=2.3,<3",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
poi = "poi_service.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poi_service"]

[tool.ruff]
line-length = 110
target-version = "py313"
